version: "3"

vars:
  APP_NAME: Maze
  ROOT_DIR: "{{.TASKFILE_DIR}}/.."
  MAIN: ./cmd/maze
  INSTALL_DIR: "{{.ROOT_DIR}}/build"
  DIST_DIR: "{{.ROOT_DIR}}/dist"
  DIST_ROOT: "{{.DIST_DIR}}/Maze"
  ARCHIVE: "{{.ROOT_DIR}}/Maze.zip"
  DOC_FILE: "{{.TASKFILE_DIR}}/dvi.txt"
  BIN: "{{.INSTALL_DIR}}/Maze.exe"
  PS: powershell -NoProfile -ExecutionPolicy Bypass -Command

tasks:
  default:
    desc: Build the desktop application.
    deps: [ all ]

  all:
    desc: Alias for install.
    deps: [ install ]

  install:
    desc: Build Maze.exe into ../build.
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - '{{.PS}} "New-Item -ItemType Directory -Force -Path ''{{.INSTALL_DIR}}'' | Out-Null"'
      - go build -o "{{.BIN}}" "{{.MAIN}}"

  uninstall:
    desc: Remove the built executable.
    cmds:
      - '{{.PS}} "if (Test-Path -LiteralPath ''{{.BIN}}'') { Remove-Item -LiteralPath ''{{.BIN}}'' -Force }"'

  clean:
    desc: Remove build, dist, archive, and documentation outputs.
    cmds:
      - '{{.PS}} "if (Test-Path -LiteralPath ''{{.INSTALL_DIR}}'') { Remove-Item -LiteralPath ''{{.INSTALL_DIR}}'' -Recurse -Force }; if (Test-Path -LiteralPath ''{{.DIST_DIR}}'') { Remove-Item -LiteralPath ''{{.DIST_DIR}}'' -Recurse -Force }; if (Test-Path -LiteralPath ''{{.ARCHIVE}}'') { Remove-Item -LiteralPath ''{{.ARCHIVE}}'' -Recurse -Force }; if (Test-Path -LiteralPath ''{{.DOC_FILE}}'') { Remove-Item -LiteralPath ''{{.DOC_FILE}}'' -Recurse -Force }"'

  dvi:
    desc: Generate a short documentation file.
    cmds:
      - '{{.PS}} "Set-Content -Path ''{{.DOC_FILE}}'' -Encoding UTF8 -Value @(''Maze Go desktop application'', ''Build: make install or task install.'', ''Test: make tests or task tests.'', ''The GUI can load, generate, save, solve mazes, and simulate caves.'')"'

  dist:
    desc: Create ../Maze.zip with sources and README.
    deps: [ clean ]
    cmds:
      - '{{.PS}} "New-Item -ItemType Directory -Force -Path ''{{.DIST_ROOT}}/src'' | Out-Null; Copy-Item -LiteralPath ''{{.ROOT_DIR}}/README_RUS.md'', ''{{.ROOT_DIR}}/go.mod'', ''{{.ROOT_DIR}}/go.sum'' -Destination ''{{.DIST_ROOT}}'' -Force; Get-ChildItem -LiteralPath ''{{.TASKFILE_DIR}}'' -Force | Copy-Item -Destination ''{{.DIST_ROOT}}/src'' -Recurse -Force; Compress-Archive -Force -Path ''{{.DIST_ROOT}}'' -DestinationPath ''{{.ARCHIVE}}''"'

  tests:
    desc: Run Go tests with coverage.
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go test -cover ./...
